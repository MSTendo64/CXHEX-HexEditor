name: Build and Release Desktop App

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: app-windows
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: app-linux
          - os: macos-latest
            rid: osx-x64
            artifact_name: app-macos

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'  

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Publish

      run: dotnet publish "CWTEd/cxed.csproj" -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish/${{ matrix.rid }}

    - name: Package artifact (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/${{ matrix.rid }}/* -DestinationPath ./publish/app-${{ matrix.rid }}.zip

    - name: Package artifact (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cd ./publish/${{ matrix.rid }}
        chmod +x cxed
        cd ../..
        tar -czf ./publish/app-${{ matrix.rid }}.tar.gz -C ./publish/${{ matrix.rid }} .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          ./publish/app-${{ matrix.rid }}.zip
          ./publish/app-${{ matrix.rid }}.tar.gz
        retention-days: 7
        if-no-files-found: ignore

    - name: Create Release and Upload Assets
      
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
       
        files: |
          ./publish/app-${{ matrix.rid }}.zip
          ./publish/app-${{ matrix.rid }}.tar.gz
          
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
